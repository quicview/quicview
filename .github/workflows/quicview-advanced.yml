name: QuicView Advanced Checks

on:
  push:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/quicview-advanced.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/quicview-advanced.yml'

permissions:
  contents: read

concurrency:
  group: quicview-advanced-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-deny

      - name: Run cargo-deny
        run: cargo deny check --hide-inclusion-graph

  test:
    name: nextest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quicview-${{ runner.os }}-nextest-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            quicview-${{ runner.os }}-nextest-

      - name: Run tests (nextest)
        run: cargo nextest run --workspace --no-fail-fast --status-level skip

      - name: Run client http-ui tests
        run: cargo nextest run -p client --features http-ui --no-fail-fast --status-level skip
