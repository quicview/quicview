name: QuicView CI

on:
  push:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/quicview-ci.yml'
  pull_request:
    paths:
      - 'crates/**'
      - 'apps/**'
      - 'libs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/quicview-ci.yml'

permissions:
  contents: read

concurrency:
  group: quicview-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: fmt • clippy • build (ubuntu)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust (stable) with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quicview-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            quicview-${{ runner.os }}-cargo-

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic

      - name: Cargo clippy (cli http-ui)
        run: cargo clippy -p cli --features http-ui --all-targets -- -D warnings -W clippy::pedantic

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cargo clippy (leptos-web wasm)
        run: cargo clippy -p leptos-web --target wasm32-unknown-unknown -- -D warnings

      - name: Cargo build (leptos-web wasm)
        run: cargo build -p leptos-web --target wasm32-unknown-unknown --verbose

      - name: Cargo build (locked)
        run: cargo build --workspace --locked --verbose

  build-macos:
    name: fmt • clippy • build (macos)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust (stable) with clippy and rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: quicview-${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            quicview-${{ runner.os }}-cargo-

      - name: Cargo fmt (check)
        run: cargo fmt --all -- --check

      - name: Cargo clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings -W clippy::pedantic

      - name: Cargo clippy (cli http-ui)
        run: cargo clippy -p cli --features http-ui --all-targets -- -D warnings -W clippy::pedantic

      - name: Install wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cargo clippy (leptos-web wasm)
        run: cargo clippy -p leptos-web --target wasm32-unknown-unknown -- -D warnings

      - name: Cargo build (leptos-web wasm)
        run: cargo build -p leptos-web --target wasm32-unknown-unknown --verbose

      - name: Cargo build (locked)
        run: cargo build --workspace --locked --verbose
