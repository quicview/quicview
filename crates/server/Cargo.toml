[package]
name = "server"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "QuicView server with QUIC data streams, health endpoints, and screen streaming"

[features]
default = []
quic-server = ["quinn", "rustls", "rcgen", "transport"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
proto = { path = "../proto" }
hex = "0.4"
thiserror = "1.0"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
bytes = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
hyper-util = { version = "0.1", features = ["tokio"] }
config = { path = "../config" }

# QUIC server dependencies (optional)
quinn = { version = "0.11", optional = true, default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.12", optional = true }
transport = { path = "../transport", optional = true }

# Explicit placeholder lib to prevent Cargo from auto-discovering and building src/lib.rs
[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "server"
path = "src/main.rs"

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
hyper-util = { version = "0.1", features = ["tokio"] }
