[package]
name = "transport"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# TCP fallback (optional, for environments where QUIC is blocked)
tcp-fallback = []

[dependencies]
anyhow = "1.0"
tracing = "0.1"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
bytes = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rcgen = { version = "0.12", default-features = true }
sha2 = "0.10"
hex = "0.4"
rustls-native-certs = "0.7"
rustls-pemfile = "2"
hbb_common = { path = "../../libs/hbb_common" }

 
