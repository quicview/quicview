[package]
name = "cli"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "QuicView CLI for managing configuration and running client/server"

[features]
default = []
# Enable starting the client HTTP control server from CLI
http-ui = ["client/http-ui"]
# Enable macOS input injection support in client from CLI builds
macos-input = ["client/macos-input"]
# Enable macOS screen capture provider in client from CLI builds
macos-capture = ["client/macos-capture"]
# Enable clipboard endpoints in client from CLI builds
clipboard = ["client/clipboard"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
config = { path = "../config" }
proto = { path = "../proto" }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "signal"] }
server = { path = "../server" }
client = { path = "../client", default-features = false }
transport = { path = "../transport" }
webbrowser = "0.8"
urlencoding = "2"
