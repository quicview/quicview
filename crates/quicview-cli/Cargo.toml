[package]
name = "quicview-cli"
description = "CLI for QuicView: serve, connect, and extend displays"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "quicview"
path = "src/main.rs"

[dependencies]
quicview.workspace = true
quicview-protocol.workspace = true
clap.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

