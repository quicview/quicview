# QuicView Configuration
# Client-Server architecture - direct connections over QUIC/TCP+TLS

server:
  # Bind address and port for incoming connections
  host: "0.0.0.0"
  port: 21116
  
  # Display mode: auto | desktop | terminal
  # - auto: Detect display, fallback to terminal if unavailable (default)
  # - desktop: Require display, fail if unavailable
  # - terminal: Terminal-only, no screen capture
  display_mode: auto
  
  # Authentication token (or use QUICVIEW_TOKEN env var)
  # auth_token: "your-secure-token"
  
  # TLS configuration (recommended for production)
  # tls_config:
  #   enabled: true
  #   cert_path: "/path/to/cert.pem"
  #   key_path: "/path/to/key.pem"
  
  # Health endpoint for monitoring
  health_bind: "0.0.0.0"
  health_port: 21110

client_policy:
  # Set to true if you require explicit consent on the host machine before control
  require_consent: false
  # Allow remote input control (mouse/keyboard)
  allow_input_control: true
  # Allow clipboard sync via /clipboard endpoints
  allow_clipboard: true
  # File transfer is not implemented yet; leave false
  allow_file_transfer: false
