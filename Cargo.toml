[workspace]
resolver = "2"
members = [
    "crates/quicview",
    "crates/quicview-protocol",
    "crates/quicview-codec",
    "crates/quicview-capture",
    "crates/quicview-display",
    "crates/quicview-input",
    "crates/quicview-session",
    "crates/quicview-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/quicview/quicview"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging / tracing
tracing = "0.1"
tracing-subscriber = "0.3"

# Error handling
thiserror = "2"

# CLI
clap = { version = "4", features = ["derive"] }

# Benchmarking
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
quicview = { path = "crates/quicview", version = "0.1.0" }
quicview-protocol = { path = "crates/quicview-protocol", version = "0.1.0" }
quicview-codec = { path = "crates/quicview-codec", version = "0.1.0" }
quicview-capture = { path = "crates/quicview-capture", version = "0.1.0" }
quicview-display = { path = "crates/quicview-display", version = "0.1.0" }
quicview-input = { path = "crates/quicview-input", version = "0.1.0" }
quicview-session = { path = "crates/quicview-session", version = "0.1.0" }
