[package]
name = "leptos-web"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# server-side rendering not required for now
ssr = []

[dependencies]
leptos = { version = "0.6", features = ["csr"] }
leptos_meta = { version = "0.6" }
leptos_router = { version = "0.6" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Storage", "Location", "Element", "HtmlElement", "HtmlImageElement", "DomRect"] }
console_error_panic_hook = { version = "0.1", optional = true }
gloo-net = { version = "0.6", optional = true }
gloo-timers = { version = "0.3", optional = true, features = ["futures"] }
urlencoding = "2"

# Native-only HTTP client (not used in wasm)
reqwest = { version = "0.11", features = ["json"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-net = { version = "0.6" }
console_error_panic_hook = { version = "0.1" }
gloo-timers = { version = "0.3", features = ["futures"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
# For local dev, we'll use trunk; no runtime dep here.

